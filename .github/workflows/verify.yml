# 站点结构 + 几何回归：headless 三视口断言（W4 / t5）
#
# 定位与边界（诚实性声明，交付时逐字复述）：
#   - 补「留浏览器目检」缺口：本机 2 核 3.4GB 下 astro build 曾多次 OOM（历史 exit 134/137，
#     曾留下 85 文件/0 HTML 静默残骸）；2026-10-13 t21 独立实测证伪「必然 OOM」——本机全量构建
#     可以在约 17 分钟内成功完成（首次 560s 超时被杀**非** OOM，dist HTML=32 含 404.html），
#     但极慢/超时风险使其**不可依赖**——CI 仍是可靠回归路径。故本作业建立在 CI 上：
#     CI（ubuntu-latest）构建站点 → headless Chromium 在 3 视口（375/768/1280）加载
#     10 条页面清单：首页 /learn/ /works/ /map/ /details/ /nav/ /details/01-context-rot/ /c/rag/ /c/rag/ 404
#     （共 30 组合。**权威来源 = site/tools/visual-check.mjs 的 PAGES**，本行与 README 只是它的镜像）
#     G0-2（2026-10-14）：`/nav/` 此前是 33 页里唯一没有任何几何回归的一页（本文件早已把它列为
#     关键页，几何断言却漏了它）；`details/01-context-rot/` 此前详情页零几何覆盖（03-D16(a)）。
#   - 只断言**结构与几何**：① 无横向溢出 ② 关键元素可见（header 导航/页标题/卡片容器）③ 无 console error
#   - **不**断言视觉审美（配色/排版/美观）——像素级视觉仍留浏览器人工目检，本作业不覆盖、不冒充覆盖
#   - 本机不保证能装 headless 浏览器——CI 实跑为证据；断言器本机预检走 `node site/tools/visual-check.mjs --selftest`（不依赖站点构建）
#
# 与 deploy 的关系：独立 workflow、独立 concurrency 组；deploy（GitHub Pages）不依赖本作业，
# 本作业也不依赖 deploy——互不阻塞。不改动 deploy.yml 的任何语义。
#
# 负路径自证（可证伪性）：workflow_dispatch 传 fault=overflow / missing-element 时，
# 检查脚本在运行时注入故障（不改任何仓库文件）后作业**必须失败**；
# 日志区分「故障已检出（预期失败）」与「故障未被检出（断言器过弱，同样失败）」——
# 恒真的作业在这里同样跑不绿。
name: Verify site (structure + 3-viewport)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fault:
        description: '负路径自证：注入故障（overflow / missing-element 时作业必须失败）'
        required: false
        default: none
        type: choice
        options: [none, overflow, missing-element]

permissions:
  contents: read

concurrency:
  group: verify-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # ── 口径一致性门禁（D7 的机制性修复，t7 新增；与下方 Build sanity 步骤互不重叠）──────────
      # 背景：`notes/knowledge-map.md` 的「计数口径」块自称「全仓唯一参照，其余位置只引用本块」，
      # 但该约定长期**只靠人工遵守、从来没有机器门禁**，已实测多起「修一处、漏两处」：
      #   · 口径「站点 html 32」漏了 `nav`（真值 33），在 knowledge-map.md / README.md / 本文件三处各有手工副本；
      #   · `courses.ts` 注释曾写「有 npm run demo 的目录数 = 6」而实测为 10；
      #   · `README.md` 曾称「27 个文件 / ~600KB」而实测为 47 个文件 / ~996KB。
      # 本步骤把该约定升级为门禁：逐条**重算**口径块里的数字并与块内声明值比对，不符即非 0 退出；
      # 同时交叉核对同一口径的其余手工副本（README.md / courses.ts 注释 / 本文件），
      # 于是「改了知识库却忘了同步口径块」或「改了口径块却与实际不符」下次会被机器抓住，而非靠人记得。
      # 刻意置于 `Build site` **之前**：口径失真属廉价可判定的问题，应在耗时的站点构建（CI 上数分钟）
      # 之前就失败，而不是等构建跑完才在下方的 Build sanity 里暴露。
      # 本步骤不依赖站点构建产物（不读 site/dist）、不读 node_modules，仅用 Node 内置模块读源码与文件系统，秒级完成。
      # 边界诚实：本步骤绿只证明「口径块与实数一致」，**不**证明页面渲染正确——渲染正确性由下方
      # Build sanity（dist 等值断言 32 + 关键页非空）与本作业后续的 3 视口 headless 断言覆盖。
      - name: Counter consistency gate (口径门禁)
        run: node site/tools/check-counters.mjs

      # ── 类集合门禁（G0-5 / 纪律 #9，2026-10-14 新增）──────────────────────────
      # 背景：CSS 选择器可以挂在**从未存在的祖先类**下而静默失效——实测 `learn.astro` 定义了
      # `.lf-count-note`，而页面输出的是 `.lw-count-note`（只差一个字母前缀），浏览器里看不出任何
      # 异常（这条规则本来只调字号/颜色）。这类缺陷**不会被「页面里有没有这个 class」抓住**，
      # 必须做集合比对：`CSS 定义的类集合 − 页面实际输出的类集合`。
      # 输入面 = **site/src 源码**（源码里同时给出「定义」与「输出」两侧，与构建无关）——
      # **不读 site/dist**：dist 曾出现「89 文件 / 0 HTML」的残骸，拿它当基准 ⇒ 输出集为空 ⇒
      # 门禁恒真（05 坑 18 / R12）。脚本内含「输入面为空即 exit 1」断言与白名单失效检测；
      # 负路径自证 = `node site/tools/check-classes.mjs --self-test`（注入死选择器必须被抓，抓到即 exit 1）。
      # 与口径门禁一样置于 `Build site` **之前**（廉价可判定、fail fast）。脚本只读，不写工作区。
      - name: Class-set gate (类集合门禁)
        run: node site/tools/check-classes.mjs

      # ── 语料 chunk 数守卫（2026-10-19 新增）────────────────────────────────
      # 背景：rag-demo 的「语料 N chunks」在本仓**漂移过两次**（85 → 132 → 123），
      # 每次都是删/增 notes 小节后声明值没同步，而它有 6 处副本（rag.md §13 是唯一真源，
      # site/src/utils/ragStats.ts 构建期解析它并在站点上显示数字）。此前**没有任何机器校验**。
      # 修法按「修生成器而非修显示值」：校验脚本放在生成器旁边（rag-demo/src/check-corpus.ts），
      # 由它比对「rag.md §13 声明值」与「loadCorpus() 实际值」，不一致即 exit 1。
      # 为什么单独一步而不并进 check-counters.mjs：口径门禁只用 Node 内置模块、不装依赖（秒级），
      # 而语料计数必须 import rag-demo 的 TS 生成器；故单独装 rag-demo 依赖后运行。
      - name: Corpus chunk-count guard (语料 chunk 数守卫)
        working-directory: rag-demo
        run: |
          npm ci
          npm run check:corpus

      - name: Build site
        working-directory: site
        run: npm run build

      # 本机 OOM 事故的 CI 免疫：dist 必须真的产出了 HTML（本机曾留下 85 文件/0 HTML 的残骸，
      # 若构建被 OOM 杀掉而后续步骤侥幸跑过，这类静默残骸就是「页面没坏」假证据的温床）。
      # 站点 html 口径（2026-10-14 结构重组实测更正，见 notes/knowledge-map.md 计数口径块）：
      #   32 = 7 静态页 + 17 课程页 + 8 专题页（三桶互斥且穷尽，成员逐一枚举）：
      #      · 8 静态页（site/src/pages/**/*.astro 中的非动态页，即文件名不含 [ 参数者）：
      #        index / learn / works / map / nav / 404 / details/index
      #      · 17 课程页（site/src/pages/c/[slug].astro）
      #      · 8 专题页（site/src/pages/details/[slug].astro）
      #   等价写法：7 顶层页含 404 + 1 details/index + 17 + 8。
      #   ⚠️ 禁止把 404 在静态页之外再计一次——历史上曾写成未枚举成员的「7 静态页」另外
      #   再加一个 404，那个「7」会被读成 `ls site/src/pages/*.astro` 的 7 个文件（含 404），
      #   从而被读成 404 重复计数。
      # 原写「6 静态页…= 32」的枚举**漏了 nav**（site/src/pages/nav.astro 是真实顶层页，
      # Header 导航栏 + index 卡片均链向 /nav/）。下界断言 `-ge 32` 结构上永远发现不了
      # 「少枚举一个页面」，故这里改为**等值断言**（2026-10-14 起为 33），并把 nav/index.html 补进关键页清单。
      # 2026-10-19 去面试化：删除 /interview/ 页后等值断言 33 → **32**（静态页 8 → 7）。
      # 实测依据：2026-10-14 t2 本机全量构建 `astro build` → 「33 page(s) built in 484.44s」+
      # `find site/dist -name '*.html' | wc -l` → 33。但本机构建**不稳定**：同日复跑一次在
      # `client (vite) transforming` 阶段被杀（内存 3.4G 争用），故本机成或败都不代表 CI 结果——
      # **构建产物数以 CI 为准**。本步骤的等值断言即为此在 CI 上的守门。
      - name: Build sanity (dist must contain real HTML)
        run: |
          count=$(find site/dist -name '*.html' | wc -l)
          echo "dist HTML 文件数 = $count（等值断言 32 = 7 静态页（index/learn/works/map/nav/404/details/index）+ 17 课程页（c/[slug]）+ 8 专题页（details/[slug]））"
          test "$count" -eq 32
          for p in index.html nav/index.html learn/index.html works/index.html map/index.html details/index.html c/rag/index.html 404.html; do
            [ -s "site/dist/$p" ] || { echo "关键页缺失或为空：$p"; exit 1; }
            echo "  关键页存在且非空：$p"
          done

      - name: Install headless browser (Chromium)
        working-directory: site
        run: npx playwright install --with-deps chromium

      # 站点以 base=/learn-agent-harness/ 构建（astro 只改 URL 前缀，dist 仍是平铺结构），
      # 线上由反代把 /learn-agent-harness/ 前缀映射到 Pages 内容根。这里用符号链接目录
      # 1:1 复刻该语义：/learn-agent-harness/<path> → site/dist/<path>。
      - name: Serve dist (static server)
        run: |
          mkdir -p /tmp/serve-root
          ln -s "$(pwd)/site/dist" /tmp/serve-root/learn-agent-harness
          python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/serve-root > /tmp/httpd.log 2>&1 &
          echo $! > /tmp/httpd.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/learn-agent-harness/ > /dev/null; then
              echo "static server ready on 127.0.0.1:4173"
              break
            fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/learn-agent-harness/ > /dev/null || { echo "static server 未就绪"; cat /tmp/httpd.log; exit 1; }

      - name: Run 3-viewport structure + geometry assertions
        working-directory: site
        env:
          FAULT: ${{ github.event.inputs.fault || 'none' }}
        run: |
          if [ "$FAULT" != "none" ]; then
            echo "⚠️ 负路径：fault=$FAULT（运行时注入故障，作业按设计必须失败）"
            node tools/visual-check.mjs --base "http://127.0.0.1:4173/learn-agent-harness/" --out tools/out --fault "$FAULT"
          else
            node tools/visual-check.mjs --base "http://127.0.0.1:4173/learn-agent-harness/" --out tools/out
          fi

      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/httpd.pid)" 2>/dev/null || true

      # 截图 + report.json 作为 artifact（失败时也上传：现场即证据）。
      # fault 模式（负路径自证）同样产出失败现场截图（*_fault-*.png，t16/F2 加固——
      # 原实现 fault 模式按设计只出 report.json、无截图，失败现场不可视）。
      - name: Upload screenshots + report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-verify-${{ github.run_id }}
          path: site/tools/out
          retention-days: 14
          if-no-files-found: warn
