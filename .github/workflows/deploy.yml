# GitHub Pages 部署：push main 或手动触发
# 站点在 site/（Astro 静态构建 → site/dist）。
# 仓库 Pages 设置（source = GitHub Actions）在 web 侧配置，本 workflow 不处理。
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      # ── Build sanity（PRES-F7 修复，2026-10-19 新增）────────────────────────────
      # 修复前：本部署作业只跑 `npm run build` 就直接 `upload-pages-artifact`，
      # 而产物断言（dist HTML 等值 32 + 关键页非空）只存在于 `verify.yml`——
      # 两个 workflow 互不阻塞，于是「构建产出 0 HTML 但 exit 0」时**没有任何步骤会拦下**，
      # 空目录会被上传到 Pages 并覆盖线上站点（本机 site/dist 正是「89 文件 / 0 HTML」残骸）。
      # 现把 verify.yml 的同款断言复制到这里，使**部署路径自身**校验产物后再上传。
      # 边界诚实：本断言只证明「产物文件数与非空性」，**不**证明页面渲染/视觉正确（后者由 verify.yml 的
      # 3 视口 headless 断言覆盖）；等值 32 的口径来源见 site/tools/check-counters.mjs 与 knowledge-map 口径块。
      - name: Build sanity (dist must contain real HTML)
        run: |
          count=$(find site/dist -name '*.html' | wc -l)
          echo "dist HTML 文件数 = $count（等值断言 32 = 7 静态页（index/learn/works/map/nav/404/details/index）+ 17 课程页（c/[slug]）+ 8 专题页（details/[slug]））"
          test "$count" -eq 32
          for p in index.html nav/index.html learn/index.html works/index.html map/index.html details/index.html c/rag/index.html 404.html; do
            [ -s "site/dist/$p" ] || { echo "关键页缺失或为空：$p"; exit 1; }
            echo "  关键页存在且非空：$p"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
