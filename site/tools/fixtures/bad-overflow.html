<!doctype html>
<!-- selftest fixture：good.html + 一处**真实标记**的横向溢出（5000px 绝对定位条）。
     断言器对它的预期：3 视口的「无横向溢出」断言全部失败；元素断言不受牵连。
     若溢出断言没失败 = 断言器恒真（抓不到横向溢出），selftest 报错。 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bad-overflow fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .site-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #ccc; }
  .brand { font-weight: bold; }
  .site-nav { display: flex; gap: 8px; }
  .site-nav a { text-decoration: none; color: #333; padding: 4px 8px; }
  .nav-toggle { display: none; }
  h1 { margin: 24px 16px 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 16px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
  @media (max-width: 720px) {
    .site-nav { display: none; }
    .nav-toggle { display: inline-flex; }
  }
</style>
</head>
<body>
  <!-- 注入的缺陷：真实存在于标记中的横向溢出 -->
  <div style="position:absolute;left:0;top:0;width:5000px;height:24px;background:#f00;"></div>
  <header class="site-header">
    <span class="brand">fixture-brand</span>
    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="#">首页</a>
      <a href="#">题库</a>
      <a href="#">学习路线</a>
      <a href="#">详解</a>
      <a href="#">作品</a>
      <a href="#">知识地图</a>
      <a href="#">时间线</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="打开导航菜单">≡</button>
  </header>
  <h1>bad-overflow fixture 页标题</h1>
  <div class="cards">
    <div class="card">card-1</div>
    <div class="card">card-2</div>
    <div class="card">card-3</div>
  </div>
</body>
</html>
